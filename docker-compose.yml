services:
  profile_checker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: profile_checker
    environment:
      - LOG_LEVEL=INFO
    command: uvicorn profile_checker.main:app --host 0.0.0.0 --port 8000
    networks:
      - platform_net

  profile_search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: profile_search
    environment:
      - TWEEPY_BEARER_TOKEN=${TWEEPY_BEARER_TOKEN}
    command: uvicorn profile_search.server:app --host 0.0.0.0 --port 8000
    networks:
      - platform_net

  phone_search:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: phone_search
    environment:
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
    command: uvicorn phone_search.server:app --host 0.0.0.0 --port 8000
    networks:
      - platform_net

  dataset_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: dataset_service
    environment:
      - DATASET_DB_PATH=/data/datasets.db
    command: uvicorn dataset_service.server:app --host 0.0.0.0 --port 8000
    volumes:
      - dataset_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform_net

  social_mapping:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_DIR: social_mapping
    environment:
      - DATASET_SERVICE_URL=http://dataset_service:8000
      - TWEEPY_BEARER_TOKEN=${TWEEPY_BEARER_TOKEN:-}
      - NOMINATIM_BASE_URL=${NOMINATIM_BASE_URL:-https://nominatim.openstreetmap.org}
      - NOMINATIM_USER_AGENT=${NOMINATIM_USER_AGENT:-social-mapping/1.0 (+https://github.com/osint-services/social_mapping)}
      - GEOCODER_CACHE_PATH=/data/geocoder-cache.db
      - GEOCODER_CACHE_DAYS=${GEOCODER_CACHE_DAYS:-30}
      - GEOCODER_MIN_INTERVAL_SECONDS=${GEOCODER_MIN_INTERVAL_SECONDS:-1}
    command: uvicorn social_mapping.server:app --host 0.0.0.0 --port 8000
    depends_on:
      dataset_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/map/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - social_mapping_cache:/data
    networks:
      - platform_net

  proxy:
    image: nginx:stable-alpine
    depends_on:
      - profile_checker
      - profile_search
      - phone_search
      - dataset_service
      - social_mapping
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge

volumes:
  dataset_data:
  social_mapping_cache:
