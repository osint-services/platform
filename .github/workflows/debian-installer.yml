name: Platform Debian installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/debian-installer.yml', 'CHANGELOG.md']
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - '.dockerignore'
      - '.github/workflows/debian-installer.yml'
      - 'Dockerfile'
      - 'Dockerfile.proxy'
      - 'docker-compose.yml'
      - 'nginx.conf'
      - 'runtime-constraints.txt'
      - 'dataset_service/**'
      - 'examples/datasets/**'
      - 'phone_search'
      - 'profile_checker'
      - 'profile_search'
      - 'scripts/**'
      - 'social_mapping'
      - 'whoisit'
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version newer than the upgrade baseline (for example 1.2.4)
        required: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select the package version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request || ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ) ]]; then
            version=$(awk '/^## \[[0-9]+\.[0-9]+\.[0-9]+\]$/ {print substr($2, 2, length($2) - 2); exit}' CHANGELOG.md)
            if [[ "$GITHUB_EVENT_NAME" == push ]] && gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
          else
            version=${REQUESTED_VERSION:-${GITHUB_REF_NAME#v}}
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a release version in MAJOR.MINOR.PATCH format.' >&2
            exit 2
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.release.outputs.version != ''
        with:
          node-version: '22'
      - if: steps.release.outputs.version != ''
        run: sudo apt-get update -qq && sudo apt-get install -y fakeroot
      - name: Build the installer and backend images
        if: steps.release.outputs.version != ''
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: scripts/make-debian-installer.sh "$VERSION" dist
      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.version != ''
        with:
          name: linux-amd64-deb
          path: dist/whoisit_*.deb*
          if-no-files-found: error

  install:
    needs: package
    if: needs.package.outputs.version != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: fresh
            compose-version: v5.6.0
          - mode: upgrade
            compose-version: v2.40.3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-compose-action@v2
        with:
          version: ${{ matrix.compose-version }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64-deb
          path: dist
      - run: sudo apt-get update -qq && sudo apt-get install -y xvfb xauth
      - name: Install and launch the package
        env:
          TEST_MODE: ${{ matrix.mode }}
        run: |
          (cd dist && sha256sum -c ./*.sha256)
          scripts/test-debian-installer.sh dist/*.deb "$TEST_MODE"

  security:
    needs: package
    if: needs.package.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64-deb
          path: dist
      - name: Verify package checksum
        run: (cd dist && sha256sum -c ./*.sha256)
      - name: Install checksum-pinned Trivy
        run: |
          mkdir -p "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/security"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            -o "$RUNNER_TEMP/trivy.tar.gz"
          echo "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Scan all packaged OS and application dependencies
        run: scripts/scan-installer-images.sh dist/*.deb "$RUNNER_TEMP/security"
      - name: Audit the Whoisit lockfile
        if: ${{ !cancelled() }}
        working-directory: whoisit
        run: |
          mkdir -p "$RUNNER_TEMP/security"
          npm audit --include=dev --audit-level=high --json > "$RUNNER_TEMP/security/whoisit.npm.json"
      - name: Audit the standalone Social Mapping lockfile
        if: ${{ !cancelled() }}
        working-directory: social_mapping
        run: |
          mkdir -p "$RUNNER_TEMP/security"
          pnpm audit --audit-level high --json > "$RUNNER_TEMP/security/social-mapping.pnpm.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dependency-scan-reports
          path: ${{ runner.temp }}/security/*.json
          if-no-files-found: error

  publish:
    if: github.event_name == 'push'
    needs: [package, install, security]
    concurrency: publish-platform-v${{ needs.package.outputs.version }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-amd64-deb
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            exit 0
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            target=(--verify-tag)
          else
            target=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" dist/whoisit_*.deb* \
            --repo "$GITHUB_REPOSITORY" "${target[@]}" \
            --title "Platform $tag" --generate-notes \
            --notes "Debian/Ubuntu x86-64 installer. Requires a running local Docker Engine 28 or newer and Docker Compose v2 or v5. See the [installer guide](https://github.com/$GITHUB_REPOSITORY/blob/$tag/docs/debian-installer.md) for setup and upgrade steps."
